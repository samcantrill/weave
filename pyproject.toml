[project]
name = "weave"
description = "Deterministic configuration composition, provenance, and object instantiation for trusted Python projects."
version = "0.1.0"
readme = "README.md"
authors = [
    { name = "Sam Cantrill", email = "sam.cantrill@gmail.com" },
]
requires-python = ">=3.12"
dependencies = [
    "omegaconf>=2.3",
    "pydantic>=2",
    "pyyaml>=6",
]

[project.urls]
Repository = "https://github.com/samcantrill/weave"
Issues = "https://github.com/samcantrill/weave/issues"

[build-system]
requires = [
    "uv_build>=0.11.8,<0.12.0"
]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage",
    "pytest",
    "ruff",
    "pyright",
]

[tool.uv.build-backend]
module-name = "weave"

[tool.coverage.run]
source = [
    "src/weave",
]

[tool.coverage.report]
skip_empty = true

[tool.ruff]
src = ["src", "tests", "examples", "tools"]
target-version = "py312"

[tool.pyright]
exclude = [
    ".venv",
    ".ruff_cache",
    ".pytest_cache",
    "build",
    "dist",
    "tests",
]
include = [
    "src",
]
pythonVersion = "3.12"
typeCheckingMode = "standard"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = [
    "tests",
]
addopts = [
    "--strict-markers",
]
markers = [
    "package: package-local public API and import tests",
    "unit: unit tests",
    "contract: reusable config behavior contracts",
    "integration: integration-style config composition tests",
    "optional_dependency: tests that require config runtime dependencies",
]
